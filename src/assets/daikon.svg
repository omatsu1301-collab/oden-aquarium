<svg width="240" height="220" viewBox="0 0 240 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="大根キャラクター">
  <defs>
    <radialGradient id="daikon-top" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#fffdf3" />
      <stop offset="100%" stop-color="#f6e7bd" />
    </radialGradient>
    <linearGradient id="daikon-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbf2d9" />
      <stop offset="100%" stop-color="#eddca4" />
    </linearGradient>
  </defs>

  <!-- 揺れるフリル(出汁の中の襟のようなもの) -->
  <path
    d="M40 150 Q52 172 64 150 Q76 172 88 150 Q100 172 112 150 Q124 172 136 150 Q148 172 160 150 Q172 172 184 150 Q196 172 200 150 L200 165 Q120 195 40 165 Z"
    fill="#fffef8"
    opacity="0.85"
  />

  <!-- 左右のひれ -->
  <ellipse cx="34" cy="110" rx="20" ry="12" fill="#f3e3ab" transform="rotate(-18 34 110)" />
  <ellipse cx="206" cy="110" rx="20" ry="12" fill="#f3e3ab" transform="rotate(18 206 110)" />

  <!-- 胴体(円柱の輪切り) -->
  <rect x="60" y="70" width="120" height="90" rx="30" fill="url(#daikon-body)" stroke="#d9c17f" stroke-width="2" />

  <!-- 断面の年輪模様 -->
  <ellipse cx="120" cy="70" rx="60" ry="26" fill="url(#daikon-top)" stroke="#d9c17f" stroke-width="2" />
  <g stroke="#e3d09a" stroke-width="1.5" fill="none" opacity="0.7">
    <ellipse cx="120" cy="70" rx="46" ry="20" />
    <ellipse cx="120" cy="70" rx="30" ry="13" />
    <ellipse cx="120" cy="70" rx="14" ry="6" />
  </g>

  <!-- 顔 -->
  <circle cx="98" cy="120" r="4.5" fill="#3a2e1a" />
  <circle cx="142" cy="120" r="4.5" fill="#3a2e1a" />
  <ellipse cx="86" cy="130" rx="8" ry="5" fill="#f7a98c" opacity="0.75" />
  <ellipse cx="154" cy="130" rx="8" ry="5" fill="#f7a98c" opacity="0.75" />
  <path d="M108 132 Q120 140 132 132" stroke="#3a2e1a" stroke-width="3" fill="none" stroke-linecap="round" />
</svg>
